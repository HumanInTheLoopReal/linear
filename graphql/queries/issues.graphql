# ------------------------------------------------------------
# Optimized GraphQL queries for issue operations
#
# This module contains highly optimized GraphQL queries that fetch
# all necessary issue data in single requests, eliminating N+1 query
# problem common with Linear SDK. Each query uses comprehensive
# fragments to ensure consistent data structures.
# ------------------------------------------------------------

# Complete issue fragment with all relationships
#
# Combines all issue fragments into a comprehensive field selection.
# This is used when full issue details are needed including all
# relationships (state, assignee, team, project, labels, comments).
fragment CompleteIssueFields on Issue {
  id
  identifier
  url
  title
  description
  branchName
  priority
  estimate
  dueDate
  createdAt
  updatedAt
  completedAt
  state {
    id
    name
    type
  }
  assignee {
    id
    name
  }
  team {
    id
    key
    name
  }
  project {
    id
    name
  }
  labels {
    nodes {
      id
      name
    }
  }
  cycle {
    id
    name
    number
  }
  projectMilestone {
    id
    name
    targetDate
  }
  parent {
    id
    identifier
    title
    priority
    state {
      type
      name
    }
    labels {
      nodes {
        name
      }
    }
  }
  children {
    nodes {
      id
      identifier
      title
      priority
      state {
        type
        name
      }
      labels {
        nodes {
          name
        }
      }
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
        title
        priority
        state {
          type
          name
        }
        labels {
          nodes {
            name
          }
        }
      }
    }
  }
  inverseRelations {
    nodes {
      id
      type
      issue {
        id
        identifier
        title
        priority
        state {
          type
          name
        }
        labels {
          nodes {
            name
          }
        }
      }
    }
  }
}

# Epic-status fragment: parent issue summary with children state-types embedded.
# Used by `linear issues epic-status` / `close-eligible-epics` to compute
# completion progress client-side.
fragment EpicStatusFields on Issue {
  id
  identifier
  title
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  children {
    nodes {
      id
      identifier
      state {
        id
        type
      }
    }
  }
}

query GetEpicCandidates($filter: IssueFilter, $first: Int!, $after: String) {
  issues(filter: $filter, first: $first, after: $after) {
    nodes {
      ...EpicStatusFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Lean fragment for content-hash duplicate detection: only the fields needed
# to compare (title + description), score (relation counts), and re-parent
# children during a merge.
fragment DuplicateDetectionFields on Issue {
  id
  identifier
  title
  description
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  parent {
    id
    identifier
  }
  children {
    nodes {
      id
      identifier
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
        title
      }
    }
  }
  inverseRelations {
    nodes {
      id
      type
      issue {
        id
        identifier
        title
      }
    }
  }
}

query GetIssuesForDuplicateDetection(
  $filter: IssueFilter
  $first: Int!
  $after: String
) {
  issues(filter: $filter, first: $first, after: $after) {
    nodes {
      ...DuplicateDetectionFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Graph-node fields used by `depends graph` for both root expansion and
# whole-workspace scans. Includes typed relations + inverseRelations so the
# service can normalize them into directed (blocker -> blocked) edges.
# `children` is here so `depends tree` can walk into an epic's children
# (their blockers are the epic's effective downstream chain).
fragment GraphNodeFields on Issue {
  id
  identifier
  title
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  parent {
    id
    identifier
  }
  children {
    nodes {
      id
      identifier
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
      }
    }
  }
  inverseRelations {
    nodes {
      id
      type
      issue {
        id
        identifier
      }
    }
  }
}

query GetIssueGraphNode($id: String!) {
  issue(id: $id) {
    ...GraphNodeFields
  }
}

query GetOpenIssuesForGraph(
  $filter: IssueFilter
  $first: Int!
  $after: String
) {
  issues(filter: $filter, first: $first, after: $after) {
    nodes {
      ...GraphNodeFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Issue fields needed by `swarm create` / `swarm validate`: enough to identify
# the epic, enumerate its children, and read each child's blocks-relations
# (which power the in-epic dependency graph used for wave computation).
fragment SwarmIssueFields on Issue {
  id
  identifier
  title
  description
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  parent {
    id
    identifier
  }
  children {
    nodes {
      id
      identifier
      title
      priority
      assignee {
        id
        name
        email
      }
      state {
        id
        name
        type
      }
      completedAt
      canceledAt
      relations {
        nodes {
          id
          type
          relatedIssue {
            id
            identifier
          }
        }
      }
    }
  }
  labels {
    nodes {
      id
      name
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
      }
    }
  }
  inverseRelations {
    nodes {
      id
      type
      issue {
        id
        identifier
      }
    }
  }
}

query GetIssueForSwarm($id: String!) {
  issue(id: $id) {
    ...SwarmIssueFields
  }
}

# Lean fields for finding existing swarm molecules: only what we need to
# verify the label and relation back to the source epic.
fragment SwarmCandidateFields on Issue {
  id
  identifier
  title
  description
  labels {
    nodes {
      id
      name
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
      }
    }
  }
}

query FindSwarmsByLabel($filter: IssueFilter, $first: Int!, $after: String) {
  issues(filter: $filter, first: $first, after: $after) {
    nodes {
      ...SwarmCandidateFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Fields needed to render a `linear:gate` issue: identifier, state, team, and
# the full description so we can parse the `await_type`/`await_id`/timeout
# key-value block stored as plain markdown.
fragment GateIssueFields on Issue {
  id
  identifier
  title
  description
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  createdAt
  updatedAt
  labels {
    nodes {
      id
      name
    }
  }
}

query GetGates($filter: IssueFilter, $first: Int!, $after: String) {
  issues(filter: $filter, first: $first, after: $after) {
    nodes {
      ...GateIssueFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Fields for the `blocked` view: an issue plus its inverse blocks-relations.
# inverseRelations[type=blocks].issue is the BLOCKER (Linear's forward
# `blocks` edge lives on the blocker, so we look at inverse-relations from
# the perspective of the blocked issue).
fragment BlockedIssueFields on Issue {
  id
  identifier
  title
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  parent {
    id
    identifier
  }
  inverseRelations {
    nodes {
      id
      type
      issue {
        id
        identifier
        title
        state {
          id
          name
          type
        }
      }
    }
  }
}

query GetIssuesForBlockedReport(
  $filter: IssueFilter
  $first: Int!
  $after: String
) {
  issues(filter: $filter, first: $first, after: $after) {
    nodes {
      ...BlockedIssueFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Lean fields for capability-shipping: identifier, state (to gate on
# completion), team (to scope label creation), and current labels (to
# detect already-shipped and to merge the new label on update).
fragment ShipCandidateFields on Issue {
  id
  identifier
  title
  state {
    id
    name
    type
  }
  team {
    id
    key
    name
  }
  labels {
    nodes {
      id
      name
    }
  }
}

query FindIssuesByLabelName($name: String!, $first: Int!, $after: String) {
  issues(
    filter: { labels: { name: { eq: $name } } }
    first: $first
    after: $after
  ) {
    nodes {
      ...ShipCandidateFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Minimal comment fields preserved for default issue reads
fragment IssueReadDefaultCommentFields on Comment {
  id
  body
}

# Comment fields for issue read discussion expansion
fragment IssueReadCommentFields on Comment {
  id
  body
  createdAt
  editedAt
  parentId
  user {
    id
    displayName
  }
}

# Complete issue fragment with all relationships and default comments
#
# Preserves the historical issue read payload while keeping richer
# discussion metadata behind explicit flags.
fragment CompleteIssueWithDefaultCommentsFields on Issue {
  ...CompleteIssueFields
  comments {
    nodes {
      ...IssueReadDefaultCommentFields
    }
  }
}

# Complete issue fragment with all relationships and comments
#
# Combines all issue fragments into a comprehensive field selection. Used by
# the export query, which lists many issues per page, so the comment
# connection keeps Linear's default page size; `pageInfo` tells the service
# which issues need their remaining comments fetched one by one.
fragment CompleteIssueWithCommentsFields on Issue {
  ...CompleteIssueFields
  comments {
    nodes {
      ...IssueReadCommentFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Complete issue fragment with the first page of comments and its cursor
#
# Used by `issues read --with-comments` / `--with-comment-threads`. The
# service follows `comments.pageInfo` with GetIssueReadCommentsPage until
# every comment is loaded, so callers always receive the full discussion.
fragment CompleteIssueWithPagedCommentsFields on Issue {
  ...CompleteIssueFields
  comments(first: 250) {
    nodes {
      ...IssueReadCommentFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Next page of an issue's comments, in the issue-read comment shape
query GetIssueReadCommentsPage($id: String!, $first: Int!, $after: String) {
  issue(id: $id) {
    comments(first: $first, after: $after) {
      nodes {
        ...IssueReadCommentFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Complete issue fragment with all relationships, default comments, and reactions
fragment CompleteIssueWithReactionsFields on Issue {
  ...CompleteIssueWithDefaultCommentsFields
  reactions {
    ...ReactionReadFields
  }
}

