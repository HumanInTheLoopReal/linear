          or: [
            { team: { key: { eq: $teamKey } } }
            { team: { name: { eq: $teamName } } }
            { team: { id: { eq: $teamId } } }
          ]
        }
      ]
    }
    first: 10
  ) {
    nodes {
      id
      name
      isActive
      isNext
      isPrevious
      number
      startsAt
      team {
        id
        key
      }
    }
  }

  parentIssues: issues(
    filter: {
      and: [
        { team: { key: { eq: $parentTeamKey } } }
        { number: { eq: $parentIssueNumber } }
      ]
    }
    first: 1
  ) {
    nodes {
      id
      identifier
    }
  }
}

query BatchResolveIssueLabelsPage($first: Int!, $after: String) {
  issueLabels(first: $first, after: $after) {
    nodes {
      id
      name
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query BatchResolveWorkflowStatesPage($first: Int!, $after: String) {
  workflowStates(first: $first, after: $after) {
    nodes {
      id
      name
      team {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Complete issue fragment with attachments
fragment CompleteIssueWithAttachmentsFields on Issue {
  ...CompleteIssueWithDefaultCommentsFields
  attachments {
    nodes {
      ...AttachmentFields
    }
  }
}

# Get single issue by UUID with attachments
query GetIssueByIdWithAttachments($id: String!) {
  issue(id: $id) {
    ...CompleteIssueWithAttachmentsFields
  }
}

# Page workspace issues stale beyond the supplied cutoff. Used by
# `linear preflight --check` to count non-terminal issues that have not seen any
# update for N days; excludes terminal states (completed, canceled, duplicate) so the
# count reflects work in flight rather than archived history.
query CountStaleIssues(
  $cutoff: DateTimeOrDuration!
  $first: Int!
  $after: String
) {
  issues(
    filter: {
      updatedAt: { lt: $cutoff }
      state: { type: { nin: ["completed", "canceled", "duplicate"] } }
    }
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Page workspace issues that are non-terminal and have no assignee. Used
# by `linear doctor` to flag the orphan-count check (open work nobody
# owns).
query CountOrphanIssues($first: Int!, $after: String) {
  issues(
    filter: {
      assignee: { null: true }
      state: { type: { nin: ["completed", "canceled", "duplicate"] } }
    }
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Page issues bearing the `human` label, used by `linear human list` to
# surface the queue of issues flagged for human intervention. The label is
# a Linear-Hack convention (a workspace-level label named `human`); we
# filter by name rather than ID so the query works without a separate
# resolver call. State.type is included so callers can post-filter to
# open/closed without a second round-trip.
fragment HumanIssueFields on Issue {
  id
  identifier
  title
  priority
  state {
    id
    name
    type
  }
  team {
    id
    key
  }
  labels {
    nodes {
      id
      name
    }
  }
  updatedAt
}

query ListHumanIssues($first: Int!, $after: String) {
  issues(
    filter: { labels: { name: { eq: "human" } } }
    first: $first
    after: $after
  ) {
    nodes {
      ...HumanIssueFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Fetch a single issue by UUID with the minimal payload `linear human
# respond/dismiss` needs as a pre-mutation read: state.type (to detect
# already-closed issues), team.id (for state-id resolution), and the
# label list (to warn when the issue is missing the `human` label).
query GetHumanIssueById($id: String!) {
  issue(id: $id) {
    ...HumanIssueFields
  }
}

# Page all non-terminal workspace issues. Used by `linear info`
# to surface the active-work count for a workspace health snapshot.
query CountOpenIssues($first: Int!, $after: String) {
  issues(
    filter: { state: { type: { nin: ["completed", "canceled", "duplicate"] } } }
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Per-issue comment counts for a set of issue IDs, fetched in ONE request to
# back `issues list --with-comment-counts` (lin-ov30.7). Linear's
# CommentConnection exposes no `totalCount`, so we count nested comment nodes
# in the same request — still no per-issue (N+1) fan-out. The inner `first`
# bounds pathological comment volumes; counts above the cap saturate.
query GetIssueCommentCounts($filter: IssueFilter, $first: Int!) {
  issues(filter: $filter, first: $first) {
    nodes {
      id
      comments(first: 250) {
        nodes {
          id
        }
      }
    }
  }
}

# Page closed (completed, canceled, or duplicate) issues that have NOT been archived.
# A heavy un-archived backlog clutters reports and the Linear board. lin-hqiz:
# part of the doctor hygiene-check expansion. The `includeArchived` arg
# stays at its default (false) so archived issues are implicitly excluded.
query CountClosedNotArchived($first: Int!, $after: String) {
  issues(
    filter: { state: { type: { in: ["completed", "canceled", "duplicate"] } } }
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Page non-terminal issues whose parent has been archived. Linear preserves the
# parentId reference even after the parent is archived, so a child can
# end up "stranded" with a tombstone parent. lin-hqiz: part of the doctor
# hygiene-check expansion. `includeArchived: true` is required so the
# filter can resolve archived parents.
query CountBrokenParentEdges($first: Int!, $after: String) {
  issues(
    filter: {
      state: { type: { nin: ["completed", "canceled", "duplicate"] } }
      parent: { archivedAt: { null: false } }
    }
    includeArchived: true
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Page stale non-terminal issues scoped to a specific team. lin-hqiz:
# the doctor's workspace-wide stale check leaks across teams; the
# team-scoped variant surfaces hygiene smells inside the user's
# declared default team without false-positives from other teams.
query CountStaleIssuesInTeam(
  $teamId: ID!
  $cutoff: DateTimeOrDuration!
  $first: Int!
  $after: String
) {
  issues(
    filter: {
      team: { id: { eq: $teamId } }
      updatedAt: { lt: $cutoff }
      state: { type: { nin: ["completed", "canceled", "duplicate"] } }
    }
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Page workspace issues currently sitting in any `triage`-type state. Used
# by `linear preflight --check` to flag a growing triage backlog.
query CountTriageIssues($first: Int!, $after: String) {
  issues(
    filter: { state: { type: { eq: "triage" } } }
    first: $first
    after: $after
  ) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Get issue by identifier with attachments
query GetIssueByIdentifierWithAttachments($teamKey: String!, $number: Float!) {
  issues(
    filter: { team: { key: { eq: $teamKey } }, number: { eq: $number } }
    first: 1
  ) {
    nodes {
      ...CompleteIssueWithAttachmentsFields
    }
  }
}

# Paginated export query — pulls every field needed to emit the JSONL export.
# Combines CompleteIssueFields (state, team, labels, relations,
# inverseRelations, parent/children) with the richer comment fields needed
# for round-trip migration. `includeArchived: true` is forwarded so the
# command can opt-in via `--all`. The IssueFilter passthrough lets the
# command apply server-side narrowing (e.g. team scope).
query ListIssuesForExport(
  $first: Int!
  $after: String
  $filter: IssueFilter
  $includeArchived: Boolean
) {
  issues(
    first: $first
    after: $after
    filter: $filter
    includeArchived: $includeArchived
  ) {
    nodes {
      ...CompleteIssueWithCommentsFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
